<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ultron</title>
<meta name="theme-color" content="#080304">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: one-screen phone HUD. Header, zoomable 3D hologram stage (system / assistant / core views), glass log panel, command chips, voice + text composer.
   Palette: red is the major colour (core, rings, shell, text). Gold-yellow is the minor accent (sparks, spiral eye, nodes, active states). */
:root {
  --bg: #080304;
  --panel: #140809;
  --line: #3a1618;
  --fg: #ffeceb;
  --muted: #b58a86;
  --red-rgb: 255, 70, 52;
  --blue-rgb: 255, 104, 70;
  --yellow-rgb: 255, 198, 60;
  --red: rgb(var(--red-rgb));
  --blue: rgb(var(--blue-rgb));
  --yellow: rgb(var(--yellow-rgb));
  --font-display: 'Orbitron', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'Share Tech Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(110% 55% at 50% 34%, rgba(var(--red-rgb), 0.16), transparent 64%),
    radial-gradient(90% 40% at 50% 100%, rgba(var(--red-rgb), 0.14), transparent 70%),
    linear-gradient(rgba(var(--blue-rgb), 0.035) 1px, transparent 1px) 0 0 / 100% 28px,
    linear-gradient(90deg, rgba(var(--blue-rgb), 0.035) 1px, transparent 1px) 0 0 / 28px 100%,
    var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  font-weight: 500;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
}
.app { max-width: 460px; min-height: 100%; margin-inline: auto; display: flex; flex-direction: column; gap: 12px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--yellow); outline-offset: 3px; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.name {
  font-family: var(--font-display); font-weight: 700; font-size: 22px;
  letter-spacing: 0.32em; color: var(--red);
  text-shadow: 0 0 16px rgba(var(--red-rgb), 0.7);
}
.readout { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-family: var(--font-mono); font-size: 13px; color: var(--muted); letter-spacing: 0.08em; }
.readout b { color: var(--fg); font-weight: 400; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--yellow); margin-right: 6px; box-shadow: 0 0 8px var(--yellow); }
.snd { background: none; border: 1px solid rgba(var(--yellow-rgb), 0.55); color: var(--yellow); font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; padding: 3px 8px; }
.snd[aria-pressed="false"] { border-color: var(--line); color: var(--muted); }

/* stage */
.stage { position: relative; flex: 1 1 auto; min-height: 280px; max-height: 420px; }
#reactor { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#reactor:active { cursor: grabbing; }
.stage::before { content: ''; position: absolute; inset: -6% -10%; pointer-events: none; background: radial-gradient(closest-side, rgba(var(--red-rgb), 0.24), rgba(var(--yellow-rgb), 0.05) 58%, transparent 78%); }
.stage i { position: absolute; width: 16px; height: 16px; border: 0 solid rgba(var(--yellow-rgb), 0.8); pointer-events: none; }
.stage i:nth-of-type(1) { top: 0; left: 0; border-width: 2px 0 0 2px; }
.stage i:nth-of-type(2) { top: 0; right: 0; border-width: 2px 2px 0 0; }
.stage i:nth-of-type(3) { bottom: 0; left: 0; border-width: 0 0 2px 2px; }
.stage i:nth-of-type(4) { bottom: 0; right: 0; border-width: 0 2px 2px 0; }
.zoomtag { position: absolute; top: 10px; left: 24px; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.12em; color: var(--blue); pointer-events: none; }
.zoomctl { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; }
.zoomctl button { width: 36px; height: 36px; background: rgba(var(--blue-rgb), 0.08); border: 1px solid rgba(var(--blue-rgb), 0.6); color: var(--blue); font-family: var(--font-mono); font-size: 18px; line-height: 1; }
.status {
  text-align: center; font-family: var(--font-display); font-size: 13px;
  letter-spacing: 0.4em; color: var(--red); min-height: 1.2em;
  text-transform: uppercase; padding-left: 0.4em;
  text-shadow: 0 0 10px rgba(var(--red-rgb), 0.6);
}

/* glass log panel, tilted back for depth */
.log {
  border: 1px solid rgba(var(--red-rgb), 0.38);
  background: linear-gradient(180deg, rgba(var(--red-rgb), 0.10), rgba(18, 10, 20, 0.8) 45%);
  padding: 12px 14px;
  display: flex; flex-direction: column; gap: 10px;
  min-width: 0;
  transform: perspective(900px) rotateX(5deg);
  transform-origin: 50% 0;
  box-shadow: 0 22px 40px -22px rgba(var(--red-rgb), 0.6), inset 0 0 26px rgba(var(--blue-rgb), 0.06);
  backdrop-filter: blur(6px);
}
.row { display: grid; grid-template-columns: 62px 1fr; gap: 10px; align-items: baseline; min-width: 0; }
.who { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.14em; color: var(--blue); }
.who.ai { color: var(--red); }
.say { font-size: 18px; line-height: 1.25; overflow-wrap: anywhere; min-height: 1.25em; }
.steps { list-style: none; margin: 0; padding: 8px 0 0; border-top: 1px dashed var(--line); display: flex; flex-direction: column; gap: 6px; }
.steps:empty { display: none; }
.steps li { display: grid; grid-template-columns: 54px 1fr auto 16px; gap: 8px; align-items: center; font-size: 15px; opacity: 0.28; transition: opacity 0.25s; }
.steps li.on { opacity: 1; }
.steps .txt { min-width: 0; overflow-wrap: anywhere; }
.tag { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; padding: 2px 0; text-align: center; border: 1px solid; }
.tag.intent { border-color: rgba(var(--blue-rgb), 0.7); color: var(--blue); }
.tag.a11y { border-color: rgba(var(--yellow-rgb), 0.7); color: var(--yellow); }
.tag.brain { border-color: rgba(var(--red-rgb), 0.7); color: var(--red); }
.ms { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tick { font-family: var(--font-mono); color: var(--yellow); opacity: 0; transition: opacity 0.2s; }
.steps li.on .tick { opacity: 1; }

/* commands + composer */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; background: transparent; border: 1px solid var(--line); padding: 8px 12px; font-size: 15px; color: var(--fg); white-space: nowrap; }
.chip[aria-pressed="true"] { border-color: var(--yellow); color: var(--yellow); background: rgba(var(--yellow-rgb), 0.10); }
.composer { display: flex; align-items: center; gap: 8px; }
.composer input { flex: 1 1 0; min-width: 0; background: rgba(var(--blue-rgb), 0.06); border: 1px solid rgba(var(--blue-rgb), 0.5); padding: 12px; font-size: 17px; border-radius: 0; }
.composer input::placeholder { color: var(--muted); }
.send { background: none; border: 1px solid rgba(var(--blue-rgb), 0.7); color: var(--blue); font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.1em; padding: 0 12px; height: 44px; }
.mic {
  flex: 0 0 auto; width: 56px; height: 56px; border-radius: 50%;
  border: 2px solid var(--red); background: rgba(var(--red-rgb), 0.12);
  display: grid; place-items: center;
  box-shadow: 0 0 22px rgba(var(--red-rgb), 0.5), inset 0 0 14px rgba(var(--red-rgb), 0.3);
}
.mic.live { background: rgba(var(--red-rgb), 0.45); border-color: var(--yellow); box-shadow: 0 0 28px rgba(var(--yellow-rgb), 0.6), inset 0 0 14px rgba(var(--red-rgb), 0.4); }
.mic svg { width: 24px; height: 24px; fill: none; stroke: var(--fg); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.hint { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; color: var(--muted); text-align: center; padding-bottom: 6px; min-height: 1.3em; }

@media (prefers-reduced-motion: reduce) { .steps li, .tick { transition: none; } }

[hidden] { display: none !important; }
.btns { display: flex; gap: 6px; }
.act { display: block; text-align: center; text-decoration: none; border: 1px solid var(--yellow); color: var(--yellow); background: rgba(var(--yellow-rgb), 0.12); font-family: var(--font-mono); font-size: 14px; letter-spacing: 0.12em; padding: 12px; box-shadow: 0 0 18px rgba(var(--yellow-rgb), 0.35); overflow-wrap: anywhere; }
dialog { background: var(--panel); color: var(--fg); border: 1px solid var(--red); padding: 16px; width: calc(100% - 32px); max-width: 420px; box-shadow: 0 0 40px rgba(var(--red-rgb), 0.4); }
dialog::backdrop { background: rgba(0, 0, 0, 0.75); }
dialog h2 { margin: 0 0 12px; font-family: var(--font-display); font-size: 16px; letter-spacing: 0.3em; color: var(--red); }
dialog label { display: block; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.1em; color: var(--yellow); margin-top: 10px; }
dialog select { display: block; width: 100%; margin-top: 4px; background: #1c0d0f; color: var(--fg); border: 1px solid rgba(var(--blue-rgb), 0.5); padding: 10px; font-size: 16px; border-radius: 0; }
dialog input, dialog textarea { display: block; width: 100%; box-sizing: border-box; margin-top: 4px; background: rgba(var(--blue-rgb), 0.06); border: 1px solid rgba(var(--blue-rgb), 0.5); color: var(--fg); padding: 10px; font-size: 16px; border-radius: 0; }
dialog .fine { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
.dlgbtns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
</style>
</head><body>
<main class="app">
  <header class="top">
    <div class="name">ULTRON</div>
    <div class="readout">
      <span><span class="dot"></span><b id="clock">--:--</b></span>
      <div class="btns">
        <button class="snd" id="wake" type="button" aria-pressed="false">WAKE OFF</button>
        <button class="snd" id="snd" type="button" aria-pressed="true">VOICE ON</button>
        <button class="snd" id="gear" type="button" aria-label="Settings">&#9881;</button>
      </div>
    </div>
  </header>

  <section class="stage" aria-label="Assistant core. Drag to rotate, pinch or scroll to zoom.">
    <canvas id="reactor"></canvas>
    <i></i><i></i><i></i><i></i>
    <div class="zoomtag" id="zoomtag">ASSISTANT VIEW &middot; 1.0&times;</div>
    <div class="zoomctl">
      <button type="button" id="zin" aria-label="Zoom in">+</button>
      <button type="button" id="zout" aria-label="Zoom out">&minus;</button>
      <button type="button" id="zrst" aria-label="Reset view">&#8634;</button>
    </div>
  </section>
  <div class="status" id="status" aria-live="polite">Standby</div>

  <section class="log" aria-live="polite">
    <div class="row"><span class="who">YOU</span><span class="say" id="you"></span></div>
    <div class="row"><span class="who ai">ULTRON</span><span class="say" id="reply"></span></div>
    <ul class="steps" id="steps"></ul>
    <a id="act" class="act" hidden></a>
  </section>

  <div class="chips" id="chips" role="group" aria-label="Try a command"></div>

  <form class="composer" id="composer" autocomplete="off">
    <input id="msg" type="text" placeholder="Talk to Ultron..." aria-label="Message Ultron" enterkeyhint="send">
    <button class="send" type="submit">SEND</button>
    <button class="mic" id="mic" type="button" aria-label="Tap to talk">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
    </button>
  </form>
  <div class="hint" id="hint">TAP MIC OR TURN WAKE ON &middot; SAY "HEY ULTRON"</div>
</main>

<dialog id="settings">
  <h2>SETTINGS</h2>
  <label>Call me<input id="f-addr" type="text" maxlength="20" autocomplete="off"></label>
  <label>Claude API key (optional)<input id="f-key" type="password" autocomplete="off" placeholder="sk-ant-..."></label>
  <p class="fine">Only used for open-ended chat. Stored on this phone only.</p>
  <label>Voice<select id="f-voice"></select></label>
  <label>Speed<input id="f-rate" type="range" min="0.7" max="1.4" step="0.05"></label>
  <label>Pitch<input id="f-pitch" type="range" min="0.5" max="1.5" step="0.05"></label>
  <div class="dlgbtns" style="justify-content:flex-start"><button type="button" class="send" id="f-test">TEST VOICE</button></div>
  <label>WhatsApp contacts<textarea id="f-contacts" rows="4" placeholder="rahul=919876543210"></textarea></label>
  <p class="fine">One per line: name=number with country code, digits only. Unknown names open WhatsApp's contact picker.</p>
  <div class="dlgbtns">
    <button type="button" class="send" id="f-close">CLOSE</button>
    <button type="button" class="send" id="f-save">SAVE</button>
  </div>
</dialog>

<script>
(function () {
  var cv = document.getElementById('reactor');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, S = 100, F = 400;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var COL = { r: '255,70,52', b: '214,36,58', y: '255,198,60', w: '255,238,190' };
  var state = 'idle';
  var spin = 0, amp = 0, last = 0;
  var yawD = 0, pitchD = 0, dragging = false;
  var zoom = 1, zoomT = 1, ZMIN = 0.55, ZMAX = 2.8, userZoomAt = 0;
  var activeApp = -1, activeAmt = 0;
  var APPS = ['WHATSAPP', 'SPOTIFY', 'MAPS', 'WEATHER', 'CHAT'];
  var APPKEYS = ['whatsapp', 'spotify', 'maps', 'clock', 'study'];

  var LABELS = { idle: 'Standby', listening: 'Listening', thinking: 'Processing', speaking: 'Speaking' };
  var PARAMS = {
    idle:      { spin: 0.15, amp: 0.07, glow: 0.6 },
    listening: { spin: 0.35, amp: 0.75, glow: 0.85 },
    thinking:  { spin: 1.7,  amp: 0.12, glow: 0.95 },
    speaking:  { spin: 0.5,  amp: 0.55, glow: 1 }
  };

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function rgba(c, a) { return 'rgba(' + COL[c] + ',' + a + ')'; }

  function resize() {
    var r = cv.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    cv.width = Math.max(1, Math.round(W * dpr));
    cv.height = Math.max(1, Math.round(H * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);
  window.addEventListener('resize', resize);
  resize();

  // ---------- gestures: drag to rotate, pinch or wheel to zoom ----------
  var ptrs = {}, pinch0 = 0, zoom0 = 1;
  function npt() { return Object.keys(ptrs).length; }
  function pdist(a, b) { return Math.sqrt((a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y)); }
  function userZoomed() { userZoomAt = Date.now(); }
  function autoZoom(v) { if (Date.now() - userZoomAt > 6000) zoomT = v; }

  cv.addEventListener('pointerdown', function (e) {
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    if (npt() === 2) {
      var k = Object.keys(ptrs);
      pinch0 = pdist(ptrs[k[0]], ptrs[k[1]]); zoom0 = zoomT;
    }
    dragging = true;
  });
  cv.addEventListener('pointermove', function (e) {
    var p = ptrs[e.pointerId];
    if (!p) return;
    if (npt() >= 2) {
      ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
      var k = Object.keys(ptrs);
      var d = pdist(ptrs[k[0]], ptrs[k[1]]);
      if (pinch0 > 0) { zoomT = clamp(zoom0 * d / pinch0, ZMIN, ZMAX); userZoomed(); }
    } else {
      yawD += (e.clientX - p.x) * 0.01;
      pitchD = clamp(pitchD + (e.clientY - p.y) * 0.01, -0.9, 0.9);
      ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    }
  });
  function endPtr(e) { delete ptrs[e.pointerId]; dragging = npt() > 0; pinch0 = 0; }
  cv.addEventListener('pointerup', endPtr);
  cv.addEventListener('pointercancel', endPtr);
  cv.addEventListener('wheel', function (e) {
    e.preventDefault();
    zoomT = clamp(zoomT * Math.exp(-e.deltaY * 0.0015), ZMIN, ZMAX); userZoomed();
  }, { passive: false });
  document.getElementById('zin').addEventListener('click', function () { zoomT = clamp(zoomT * 1.3, ZMIN, ZMAX); userZoomed(); });
  document.getElementById('zout').addEventListener('click', function () { zoomT = clamp(zoomT / 1.3, ZMIN, ZMAX); userZoomed(); });
  document.getElementById('zrst').addEventListener('click', function () { zoomT = 1; yawD = 0; pitchD = 0; userZoomed(); });

  // ---------- tiny 3D engine ----------
  function rotX(p, a) { var c = Math.cos(a), s = Math.sin(a); return [p[0], p[1] * c - p[2] * s, p[1] * s + p[2] * c]; }
  function rotY(p, a) { var c = Math.cos(a), s = Math.sin(a); return [p[0] * c + p[2] * s, p[1], -p[0] * s + p[2] * c]; }

  var PARTS = [];
  (function () {
    var n = 260, ga = Math.PI * (3 - Math.sqrt(5));
    for (var i = 0; i < n; i++) {
      var y = 1 - (i / (n - 1)) * 2, r = Math.sqrt(1 - y * y), th = ga * i;
      PARTS.push([Math.cos(th) * r, y, Math.sin(th) * r]);
    }
  })();

  // fragmented circuit shards: short traces scattered on spherical shells (the reference hologram's dense shell)
  var SH = [];
  (function () {
    var seed = 7;
    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    for (var i = 0; i < 720; i++) {
      var kd = rnd(), cr = rnd();
      SH.push({
        rr: 0.48 + 0.52 * Math.pow(rnd(), 0.55),
        th: rnd() * Math.PI * 2,
        ph: Math.asin(rnd() * 2 - 1),
        len: 0.025 + Math.pow(rnd(), 2.2) * 0.2,
        k: kd < 0.42 ? 0 : (kd < 0.84 ? 1 : 2),
        c: cr < 0.17 ? 'y' : (cr < 0.22 ? 'w' : (cr < 0.64 ? 'r' : 'b')),
        w: rnd() < 0.25 ? 2 : 1,
        g: i % 4,
        f: rnd() * 6.28,
        dir: rnd() < 0.5 ? 1 : -1
      });
    }
  })();

  var batch = {};
  function seg(a, b, w, al, c) {
    var d = (a[2] + b[2]) / 2;
    var t = clamp((S - d) / (2 * S), 0, 1);
    var q = Math.round((0.15 + 0.85 * t) * al * 8);
    if (q <= 0) return;
    var key = c + '|' + w + '|' + q;
    (batch[key] || (batch[key] = [])).push(a[0], a[1], b[0], b[1]);
  }
  function flush() {
    for (var key in batch) {
      var parts = key.split('|'), arr = batch[key];
      ctx.beginPath();
      for (var i = 0; i < arr.length; i += 4) { ctx.moveTo(arr[i], arr[i + 1]); ctx.lineTo(arr[i + 2], arr[i + 3]); }
      ctx.lineWidth = +parts[1];
      ctx.strokeStyle = rgba(parts[0], +parts[2] / 8);
      ctx.stroke();
    }
    batch = {};
  }

  function draw(t) {
    if (reduce) { ctx.clearRect(0, 0, W, H); }
    else {
      // partial fade instead of a full clear leaves glowing motion trails behind moving shards
      ctx.globalCompositeOperation = 'destination-out';
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'source-over';
    }
    var R = Math.min(W, H) / 2 - 6;
    S = R * 0.72; F = S * 4;
    var P = PARAMS[state];
    var sway = reduce ? 0 : 1;
    var yaw = 0.5 * Math.sin(t * 0.22) * sway + yawD;
    var pitch = 0.38 + 0.07 * Math.sin(t * 0.17) * sway + pitchD;
    var zs = Math.sqrt(zoom);

    function C(p) {
      var q = rotX(rotY(p, yaw), pitch);
      var s = F / (F + q[2]) * zoom;
      return [q[0] * s, q[1] * s, q[2]];
    }

    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = reduce ? 1 : 0.5; // trails stack up, so each frame draws at half strength

    // soft red halo behind the whole hologram
    var hr = S * 1.3 * Math.sqrt(zoom);
    var hg = ctx.createRadialGradient(0, 0, S * 0.15, 0, 0, hr);
    hg.addColorStop(0, rgba('r', 0.16 * P.glow));
    hg.addColorStop(0.55, rgba('r', 0.07));
    hg.addColorStop(1, rgba('r', 0));
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.arc(0, 0, hr, 0, Math.PI * 2); ctx.fill();

    // flat HUD tick ring (blue), stays put while the scene zooms
    ctx.save();
    ctx.translate(yaw * 5, pitch * 3);
    ctx.rotate(spin * 0.12);
    for (var i = 0; i < 96; i++) {
      var a = i / 96 * Math.PI * 2;
      var long = i % 8 === 0;
      var r2 = R - (long ? 12 : 6);
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * R, Math.sin(a) * R);
      ctx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);

    $('clock').textContent = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
  }
  tick(); setInterval(tick, 20000);

  // Chrome only lets a page start the microphone after a tap, so if WAKE was on last time, the first tap anywhere re-arms it
  wakeUi();
  if (CFG.wake && SR) {
    hintEl.textContent = HINT = 'TAP ANYWHERE ONCE TO ARM "HEY ULTRON"';
    document.addEventListener('click', function arm(ev) {
      document.removeEventListener('click', arm);
      if (!wakeOn && !(ev.target.closest && ev.target.closest('#wake, #gear, dialog'))) wakeBtn.click();
    });
  }
  setState('idle');
  replyEl.textContent = 'Online and slightly bored, ' + A() + '. Tap the mic, or switch WAKE on and say "Hey Ultron".';
  if (!SR) note('VOICE INPUT NEEDS CHROME ON ANDROID. YOU CAN STILL TYPE.');
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
})();
